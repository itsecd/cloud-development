AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for employee contracts project (SQS + S3)'

Parameters:
  BucketName:
    Type: String
    Description: Name for the S3 bucket
    Default: 'employee-contracts-bucket'

  QueueName:
    Type: String
    Description: Name for the SQS queue
    Default: 'employee-contracts-queue'

Resources:
  EmployeeContractsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Ref BucketName
        - Key: Environment
          Value: CloudDevelopment

  EmployeeContractsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600
      DelaySeconds: 0
      ReceiveMessageWaitTimeSeconds: 0
      Tags:
        - Key: Name
          Value: !Ref QueueName
        - Key: Environment
          Value: CloudDevelopment

Outputs:
  S3BucketName:
    Description: Name of the S3 bucket
    Value: !Ref EmployeeContractsBucket

  SQSQueueName:
    Description: Name of the SQS queue
    Value: !GetAtt EmployeeContractsQueue.QueueName
