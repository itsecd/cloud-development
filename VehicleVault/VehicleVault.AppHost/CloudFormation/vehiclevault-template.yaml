AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for VehicleVault project (SQS + S3)'

Parameters:
  BucketName:
    Type: String
    Description: Name for the S3 bucket
    Default: 'vehiclevault-bucket'

  QueueName:
    Type: String
    Description: Name for the SQS queue
    Default: 'vehiclevault-queue'

Resources:
  VehicleVaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Name
          Value: !Ref BucketName
        - Key: Environment
          Value: VehicleVault
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VehicleVaultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600
      DelaySeconds: 0
      ReceiveMessageWaitTimeSeconds: 0
      Tags:
        - Key: Name
          Value: !Ref QueueName
        - Key: Environment
          Value: VehicleVault

Outputs:
  S3BucketName:
    Description: Name of the S3 bucket
    Value: !Ref VehicleVaultBucket

  S3BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt VehicleVaultBucket.Arn

  SQSQueueName:
    Description: Name of the SQS queue
    Value: !GetAtt VehicleVaultQueue.QueueName

  SQSQueueArn:
    Description: ARN of the SQS queue
    Value: !GetAtt VehicleVaultQueue.Arn
